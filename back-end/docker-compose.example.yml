services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-typing}
      POSTGRES_USER: ${POSTGRES_USER:-typing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    ports: ['3000:3000']
